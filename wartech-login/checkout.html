<!doctype html>
<html lang="id" data-bs-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout - WarTech</title>
<link rel="icon" href="img/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script>document.documentElement.setAttribute('data-bs-theme',localStorage.getItem('wt_tema')||'light')</script>
<style>.pay-opt{display:block;height:100%;cursor:pointer}.pay-box{display:block;height:100%;padding:1rem;border:2px solid var(--line);border-radius:1rem;transition:border-color .2s,background .2s}.pay-opt input:checked+.pay-box{border-color:var(--brand);background:var(--soft)}.pay-opt input:checked+.pay-box>i{color:var(--brand)}.pay-opt input:disabled+.pay-box{opacity:.5;cursor:not-allowed}.pay-opt input:focus-visible+.pay-box{outline:2px solid var(--brand);outline-offset:2px}</style>
</head>
<body data-base="">
<div id="nav"></div>
<main class="wt-main container">
<h1 class="h2 mb-4">Checkout</h1><div id="kosongCo" class="wt-card empty d-none"><i class="bi bi-cart-x"></i><h2 class="h5">Keranjangmu kosong</h2><a href="menu.html" class="btn btn-wt px-4 mt-2">Lihat Menu</a></div>
<form id="f" class="row g-4" novalidate><div class="col-lg-7"><div class="wt-card p-4">
 <div class="mb-3"><label class="form-label" for="nama">Nama pemesan *</label><input id="nama" class="form-control" maxlength="60" placeholder="Nama kamu"><div class="text-danger small mt-1" id="eNama"></div></div>
 <div class="mb-3"><label class="form-label" for="telp">Nomor telepon (opsional)</label><input id="telp" class="form-control" inputmode="tel" placeholder="08xxxxxxxxxx"><div class="text-danger small mt-1" id="eTelp"></div></div>
 <div class="mb-3"><label class="form-label" for="meja">Nomor meja / lokasi pengambilan (opsional)</label><input id="meja" class="form-control" maxlength="40" placeholder="Contoh: Meja 5 / ambil di kasir"></div>
 <div class="mb-3"><label class="form-label" for="cat">Catatan pesanan (opsional)</label><textarea id="cat" class="form-control" rows="2" maxlength="200"></textarea></div>
 <label class="form-label">Metode pembayaran</label><div class="row g-2"><div class="col-sm-6"><label class="pay-opt"><input type="radio" name="metode" value="tunai" class="visually-hidden" checked><span class="pay-box"><i class="bi bi-cash-coin me-2"></i><b>Tunai di kasir</b><span class="d-block small muted">Bayar ke kasir saat mengambil pesanan.</span></span></label></div>
 <div class="col-sm-6"><label class="pay-opt"><input type="radio" name="metode" value="qris" id="mQris" class="visually-hidden" disabled><span class="pay-box"><i class="bi bi-qr-code me-2"></i><b>QRIS</b><span class="d-block small muted" id="qrisNote">Belum tersedia (menunggu QR resmi kantin).</span></span></label></div></div>
 <div id="err" class="text-danger small mt-3"></div></div></div>
<div class="col-lg-5"><aside class="wt-card p-4" id="ringkas"></aside></div></form>
</main>
<div id="foot"></div>
<div class="modal fade" id="konfirm" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content" style="border-radius:24px"><div class="modal-body p-4" id="konfirmIsi"></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
