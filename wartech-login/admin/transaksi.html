<!doctype html>
<html lang="id" data-bs-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daftar Transaksi - WarTech</title>
<link rel="icon" href="../img/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<script>document.documentElement.setAttribute('data-bs-theme',localStorage.getItem('wt_tema')||'light')</script>
</head>
<body data-base="../">
<main id="isi"><div class="row g-2 mb-3"><div class="col-md"><input id="fno" class="form-control" placeholder="Cari no. transaksi / nama..." aria-label="No transaksi"></div><div class="col-6 col-md-3"><input id="ftgl" type="date" class="form-control" aria-label="Tanggal"></div>
<div class="col-6 col-md-2"><select id="fst" class="form-select" aria-label="Status"><option value="">Semua status</option><option value="menunggu">Menunggu</option><option value="diproses">Diproses</option><option value="siap">Siap Diambil</option><option value="selesai">Selesai</option><option value="batal">Dibatalkan</option></select></div>
<div class="col-md-2"><select id="fsm" class="form-select" aria-label="Sumber"><option value="">Semua sumber</option><option value="kasir">Kasir</option><option value="online">Online</option></select></div></div><p class="small muted" id="jml"></p>
<div class="wt-card p-2"><div class="table-responsive"><table class="table wt-table"><thead><tr><th>No. transaksi</th><th>Tanggal</th><th>Pelanggan</th><th>Sumber</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div></main>
<div class="modal fade" id="md" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content" style="border-radius:24px"><div class="modal-body p-4" id="mdIsi"></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/admin-transaksi.js"></script>
</body>
</html>
