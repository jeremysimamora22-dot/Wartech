<!doctype html>
<html lang="id" data-bs-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kasir - WarTech</title>
<link rel="icon" href="../img/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<script>document.documentElement.setAttribute('data-bs-theme',localStorage.getItem('wt_tema')||'light')</script>
</head>
<body data-base="../">
<main id="isi"><div class="row g-4"><div class="col-lg-5"><div class="wt-card p-3"><h2 class="h6">Pilih produk</h2><input id="q" class="form-control mb-3" placeholder="Cari kode / nama / kategori..." aria-label="Cari produk"><div id="pil" style="max-height:520px;overflow:auto"></div></div></div>
<div class="col-lg-7"><div class="wt-card p-3"><h2 class="h6">Transaksi baru</h2><div class="table-responsive"><table class="table wt-table"><thead><tr><th>Produk</th><th>Harga</th><th style="width:110px">Qty</th><th>Subtotal</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="row g-2 mt-2"><div class="col-sm-6"><label class="form-label small" for="nama">Nama pelanggan (opsional)</label><input id="nama" class="form-control" maxlength="40"></div><div class="col-sm-6"><label class="form-label small" for="bayar">Uang diterima (Rp)</label><input id="bayar" type="number" min="0" class="form-control"></div></div>
<div class="d-flex justify-content-between align-items-center mt-3"><div><div class="muted small">Total</div><div class="fs-3 fw-bold" id="tot">Rp 0</div></div><div class="text-end"><div class="muted small">Kembalian</div><div class="fs-5 fw-bold" id="kem">Rp 0</div></div></div>
<div class="text-danger small mt-2" id="er"></div><button class="btn btn-wt w-100 py-2 mt-3" id="simpan"><i class="bi bi-check2-circle"></i> Simpan Transaksi</button></div></div></div></main>
<div class="modal fade" id="ms" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content" style="border-radius:24px"><div class="modal-body p-4"><div class="alert alert-success py-2 small">Transaksi tersimpan. Stok sudah dikurangi.</div><div id="strukIsi" class="bg-white text-dark p-3 rounded-3 border"></div><div class="d-flex gap-2 justify-content-end mt-3"><button class="btn btn-ghost" id="cetak"><i class="bi bi-printer"></i> Cetak</button><button class="btn btn-wt" data-bs-dismiss="modal">Transaksi baru</button></div></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/admin-kasir.js"></script>
</body>
</html>
